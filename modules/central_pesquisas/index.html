<body>
<div id="app"><div style="padding:40px;text-align:center">Carregando Central de Pesquisas…</div></div>
<script>
/*
 * CENTRAL DE PESQUISAS — VERSÃO CORRIGIDA
 */

const sb = window.supabase.createClient(
  window.APP_CONFIG.SUPABASE_URL,
  window.APP_CONFIG.SUPABASE_ANON_KEY
);

const state = {
  user: null,
  profile: null,
  surveys: [],
  survey: null,
  regions: [],
  congregations: [],
  interviews: [],
  dashboardInterviews: [],
  page: "dashboard",
  interviewStep: 1,

  form: {
    interviewee_name: "",
    region_id: "",
    congregation_id: "",
    intention: "",
    reason: ""
  }
};

const esc = (value) =>
  String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

const fmt = (n) =>
  Number(n || 0).toLocaleString("pt-BR");

const pct = (n, total) =>
  total
    ? `${((n / total) * 100).toFixed(1).replace(".", ",")}%`
    : "0,0%";

// Serializa argumentos usados em onclick e escapa o HTML para impedir que
// aspas nos nomes quebrem o atributo e impeçam o clique.
function htmlJsArg(value) {
  return esc(JSON.stringify(String(value ?? "")));
}

async function init() {
  const {
    data: { session }
  } = await sb.auth.getSession();

  if (session) {
    await loadUser();
  }

  render();

  sb.auth.onAuthStateChange(async (_event, session) => {
    if (session) {
      try {
        await loadUser();
      } catch (error) {
        console.error(error);
      }
    } else {
      state.user = null;
      state.profile = null;
      state.surveys = [];
      state.survey = null;
    }

    render();
  });
}

async function loadUser() {
  const {
    data: { user },
    error: userError
  } = await sb.auth.getUser();

  if (userError) {
    throw userError;
  }

  state.user = user;

  const {
    data: profile,
    error
  } = await sb
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

  if (error) {
    throw error;
  }

  state.profile = profile;

  if (state.profile?.active === false) {
    await sb.auth.signOut();

    state.user = null;
    state.profile = null;

    alert(
      "Seu usuário está desativado. Procure o administrador."
    );

    return;
  }

  await loadSurveyData();
}

async function loadSurveyData() {

  if (!state.user) {
    state.surveys = [];
    state.survey = null;
    state.regions = [];
    state.congregations = [];
    state.interviews = [];
    state.dashboardInterviews = [];
    return;
  }

  /*
   * ADMINISTRADOR E COORDENADOR
   * podem visualizar todas as pesquisas.
   */
  if (
    state.profile?.role === "admin" ||
    state.profile?.role === "coordinator"
  ) {

    const {
      data: surveys,
      error
    } = await sb
      .from("surveys")
      .select("*")
      .order("created_at", {
        ascending: false
      });

    if (error) {
      throw error;
    }

    state.surveys = surveys || [];

  } else {

    /*
     * PESQUISADOR:
     * somente pesquisas liberadas para ele.
     */
    const {
      data: access,
      error
    } = await sb
      .from("survey_access")
      .select(`
        survey_id,
        can_view,
        surveys (*)
      `)
      .eq(
        "user_id",
        state.user.id
      )
      .eq(
        "can_view",
        true
      );

    if (error) {
      throw error;
    }

    state.surveys =
      (access || [])
        .map(item => item.surveys)
        .filter(Boolean)
        .filter(
          survey =>
            survey.status === "active"
        );
  }

  /*
   * Mantém a pesquisa atual se ela ainda
   * estiver disponível.
   */
  if (
    state.survey &&
    !state.surveys.some(
      s => s.id === state.survey.id
    )
  ) {
    state.survey = null;
  }

  /*
   * Se existe somente uma pesquisa disponível,
   * seleciona automaticamente.
   */
  if (
    !state.survey &&
    state.surveys.length === 1
  ) {
    state.survey =
      state.surveys[0];
  }

  if (!state.survey) {
    state.regions = [];
    state.congregations = [];
    state.interviews = [];
    state.dashboardInterviews = [];
    return;
  }

  const [
    regions,
    congregations,
    interviews
  ] = await Promise.all([

    sb
      .from("regions")
      .select("*")
      .eq(
        "survey_id",
        state.survey.id
      )
      .order("name"),

    sb
      .from("congregations")
      .select("*")
      .eq(
        "survey_id",
        state.survey.id
      )
      .order("name"),

    sb
      .from("interviews")
      .select("*")
      .eq(
        "survey_id",
        state.survey.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      )
      .limit(100)
  ]);

  if (regions.error) {
    throw regions.error;
  }

  if (congregations.error) {
    throw congregations.error;
  }

  if (interviews.error) {
    throw interviews.error;
  }

  state.regions =
    regions.data || [];

  state.congregations =
    congregations.data || [];

  state.interviews =
    interviews.data || [];

  /*
   * Dashboard administrativo:
   * carrega entrevistas de todas as pesquisas.
   */
  if (
    state.profile?.role === "admin" ||
    state.profile?.role === "coordinator"
  ) {

    const {
      data: allInterviews,
      error: allError
    } = await sb
      .from("interviews")
      .select(`
        survey_id,
        intention,
        created_at,
        interviewee_name,
        region_id,
        congregation_id
      `)
      .order(
        "created_at",
        {
          ascending: false
        }
      )
      .limit(5000);

    if (allError) {
      throw allError;
    }

    state.dashboardInterviews =
      allInterviews || [];

  } else {

    state.dashboardInterviews =
      state.interviews || [];
  }
}


/* =========================================================
   SELECIONAR PESQUISA
   ========================================================= */

async function selectSurvey(surveyId) {

  const survey =
    state.surveys.find(
      item =>
        item.id === surveyId
    );

  if (!survey) {
    alert(
      "Pesquisa não encontrada."
    );
    return;
  }

  /*
   * A lista state.surveys do pesquisador já contém
   * somente as pesquisas autorizadas.
   */
  state.survey =
    survey;

  await loadSurveyData();

  render();
}


/* =========================================================
   SELETOR DE PESQUISAS
   ========================================================= */

function surveySelector() {

  if (
    !state.surveys ||
    state.surveys.length === 0
  ) {

    return `
      <div class="card">

        <h2>
          🎯 Pesquisas autorizadas
        </h2>

        <p class="muted">
          Nenhuma pesquisa foi atribuída a você.
        </p>

      </div>
    `;
  }

  /*
   * Uma única pesquisa:
   * não mostra escolha ao pesquisador.
   */
  if (
    state.profile?.role === "researcher" &&
    state.surveys.length === 1
  ) {

    const survey =
      state.surveys[0];

    return `
      <div
        class="card"
        style="
          margin-bottom:18px;
          border-left:4px solid var(--primary);
        "
      >

        <strong>
          🎯 Pesquisa autorizada
        </strong>

        <div
          style="
            margin-top:6px;
            font-size:18px;
          "
        >
          ${esc(
            survey.candidate_name ||
            survey.name ||
            "Pesquisa"
          )}
        </div>

        <div
          class="muted"
          style="
            margin-top:3px;
          "
        >
          ${esc(
            survey.office || ""
          )}
        </div>

      </div>
    `;
  }

  /*
   * Duas ou mais pesquisas:
   * mostra SOMENTE as autorizadas.
   */
  return `
    <div
      class="card"
      style="margin-bottom:18px"
    >

      <h2>
        🎯 Pesquisas autorizadas
      </h2>

      <p class="muted">
        Selecione a pesquisa que você foi autorizado
        a realizar.
      </p>

      <div
        style="
          display:grid;
          gap:12px;
          margin-top:15px;
        "
      >

        ${state.surveys
          .map(survey => {

            const selected =
              state.survey?.id ===
              survey.id;

            return `
              <button
                type="button"
                class="card"
                onclick="
                  selectSurvey(
                    '${survey.id}'
                  )
                "
                style="
                  text-align:left;
                  cursor:pointer;
                  border:2px solid
                    ${
                      selected
                        ? "#2563eb"
                        : "#e5e7eb"
                    };
                  background:
                    ${
                      selected
                        ? "#eff6ff"
                        : "#fff"
                    };
                "
              >

                <strong>
                  ${esc(
                    survey.candidate_name ||
                    survey.name ||
                    "Pesquisa"
                  )}
                </strong>

                <div
                  class="muted"
                  style="
                    margin-top:5px;
                  "
                >
                  ${esc(
                    survey.office || ""
                  )}
                </div>

              </button>
            `;
          })
          .join("")}

      </div>

    </div>
  `;
}


/* =========================================================
   ERROS
   ========================================================= */

function showError(error) {

  console.error(
    "CENTRAL DE PESQUISAS:",
    error
  );

  alert(
    error?.message ||
    "Ocorreu um erro. Verifique o Supabase."
  );
}


/* =========================================================
   ATUALIZAR
   ========================================================= */

async function refresh() {

  if (!state.user) {
    return;
  }

  try {

    await loadSurveyData();

    render();

  } catch (error) {

    showError(error);

  }
}


/* =========================================================
   LOGIN
   ========================================================= */

/* Códigos de acesso com menos de 6 caracteres (como a senha padrão) são completados do mesmo jeito em todo lugar. */
function senhaAuth(codigo) {
  const c = String(codigo || "").trim();
  return c.length >= 6 ? c : "rmd#" + c + "#cp";
}

async function login() {

  const username =
    document
      .querySelector("#email")
      ?.value
      .trim();

  const password =
    document
      .querySelector("#password")
      ?.value;

  if (!username || !password) {

    alert(
      "Preencha usuário e código de acesso."
    );

    return;
  }

  const button =
    document.querySelector(
      "#loginButton"
    );

  if (button) {

    button.disabled =
      true;

    button.textContent =
      "ENTRANDO...";

  }

  try {

    /*
     * Login por usuário + código de acesso.
     * 1) O banco devolve o e-mail técnico do usuário ativo (função cp_login_email, sem expor mais nada).
     * 2) O Supabase Auth confere o código. Códigos curtos (ex.: a senha padrão) são completados por
     *    senhaAuth(), porque o Supabase exige pelo menos 6 caracteres.
     */
    const {
      data: loginEmail,
      error: loginError
    } = await sb.rpc("cp_login_email", { p_username: username });

    if (loginError) {
      throw loginError;
    }

    if (!loginEmail) {
      throw new Error("Usuário ou código de acesso inválido.");
    }

    const {
      error: signInError
    } = await sb.auth.signInWithPassword({
      email: loginEmail,
      password: senhaAuth(password)
    });

    if (signInError) {
      throw new Error("Usuário ou código de acesso inválido.");
    }


  } catch (error) {

    console.error(
      "Erro de login:",
      error
    );

    alert(
      error?.message ||
      "Não foi possível entrar."
    );

    if (button) {

      button.disabled =
        false;

      button.textContent =
        "ENTRAR";

    }
  }
}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout() {

  await sb.auth.signOut();

  state.user =
    null;

  state.profile =
    null;

  state.surveys =
    [];

  state.survey =
    null;

  state.regions =
    [];

  state.congregations =
    [];

  state.interviews =
    [];

  state.dashboardInterviews =
    [];

  state.page =
    "dashboard";

  render();
}


/* =========================================================
   NAVEGAÇÃO
   ========================================================= */

function nav(page) {

  state.page =
    page;

  state.interviewStep =
    1;

  if (
    page ===
    "interview"
  ) {

    resetForm();

  }

  render();
}


/* =========================================================
   LIMPAR FORMULÁRIO
   ========================================================= */

function resetForm() {

  state.form = {

    interviewee_name:
      "",

    region_id:
      "",

    congregation_id:
      "",

    intention:
      "",

    reason:
      ""
  };
}

/* =========================================================

   ========================================================= */

/* =========================================================
   PERMISSÕES
   ========================================================= */

function normalizeRole(role) {
  return String(role || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function isAdminRole(role) {
  return ["admin", "administrator", "administrador"].includes(normalizeRole(role));
}

function isCoordinatorRole(role) {
  return ["coordinator", "coordenador"].includes(normalizeRole(role));
}

function isResearcherRole(role) {
  return ["researcher", "pesquisador"].includes(normalizeRole(role));
}

function canManageUsers() {
  const role = normalizeRole(state.profile?.role);
  return isAdminRole(role) || isCoordinatorRole(role);
}

function canCreateRole(role) {

  const currentRole =
    state.profile?.role;

  if (
    currentRole ===
    "admin"
  ) {

    return true;

  }

  if (
    currentRole ===
    "coordinator"
  ) {

    return role !==
      "admin";

  }

  return false;
}

async function createUserFromPanel() {

  const fullName =
    document
      .querySelector("#newUserFullName")
      ?.value
      .trim() || "";

  const role =
    document
      .querySelector("#newUserRole")
      ?.value || "researcher";

  if (!fullName) {

    alert(
      "Digite o nome completo."
    );

    return;
  }

  if (
    ![
      "admin",
      "coordinator",
      "researcher",
      "candidate"
    ].includes(role)
  ) {

    alert(
      "Função inválida."
    );

    return;
  }

  if (
    !canCreateRole(role)
  ) {

    alert(
      "Você não tem permissão para criar essa função."
    );

    return;
  }

  const button =
    document.querySelector(
      "#createUserButton"
    );

  if (button) {

    button.disabled =
      true;

    button.textContent =
      "GERANDO...";
  }

  try {

    /*
     * Gera o código localmente.
     *
     * O código será utilizado como senha
     * no Supabase Authentication.
     */
    const accessCode =
      String(
        Math.floor(
          100000 +
          Math.random() *
          900000
        )
      );

    /*
     * A Edge Function cria o usuário
     * no Supabase Auth e o perfil.
     *
     * Nenhum e-mail é enviado.
     */
    const {
      data,
      error
    } = await sb.functions.invoke(
      "admin-users",
      {
        body: {

          action:
            "create",

          full_name:
            fullName,

          role:
            role,

          password:
            accessCode
        }
      }
    );

    if (error) {

      console.error(
        "Erro da função admin-users:",
        error
      );

      throw new Error(
        error.message ||
        "Não foi possível gerar o acesso."
      );
    }

    if (
      !data ||
      data.error
    ) {

      throw new Error(
        data?.error ||
        "O usuário não foi criado."
      );
    }

    /*
     * Usa o código devolvido pelo servidor,
     * caso ele seja retornado.
     */
    const finalAccessCode =
      data.access_code ||
      data.accessCode ||
      accessCode;

    const username =
      data.username ||
      "";

    /*
     * GUARDA O ACESSO TEMPORARIAMENTE
     * para poder copiar novamente.
     */
    window.lastCreatedUser = {

      full_name:
        fullName,

      username:
        username,

      access_code:
        finalAccessCode,

      role:
        role
    };

    /*
     * Fecha o formulário.
     */
    closeNewUserForm();

    /*
     * Atualiza a lista.
     */
    await loadProfiles();

    render();

    /*
     * Mostra o acesso completo
     * ao administrador.
     */
    showCreatedUserAccess(
      window.lastCreatedUser
    );

  } catch (error) {

    console.error(
      "Erro ao gerar acesso:",
      error
    );

    alert(
      "Não foi possível criar o usuário.\n\n" +
      (
        error?.message ||
        "Erro desconhecido."
      )
    );

  } finally {

    const currentButton =
      document.querySelector(
        "#createUserButton"
      );

    if (currentButton) {

      currentButton.disabled =
        false;

      currentButton.textContent =
        "GERAR ACESSO";
    }
  }
}

async function copyUserAccess(
  type
) {

  const user =
    window.lastCreatedUser;

  if (!user) {
    return;
  }

  const value =
    type === "username"
      ? user.username
      : user.access_code;

  try {

    await navigator.clipboard.writeText(
      value
    );

    alert(
      type === "username"
        ? "Usuário copiado!"
        : "Código de acesso copiado!"
    );

  } catch (error) {

    console.error(error);

    alert(
      value
    );
  }
}

   CARREGAR USUÁRIOS
   ========================================================= */

async function loadProfiles() {

  const {
    data,
    error
  } = await sb
    .from("profiles")
    .select(`
      id,
      full_name,
      username,
      access_code,
      role,
      active,
      created_at
    `)
    .order(
      "full_name",
      {
        ascending: true
      }
    );

  if (error) {
    throw error;
  }

  usersCache =
    data || [];

  return usersCache;
}

/* =========================================================

   ========================================================= */

async function toggleUserActive(
  userId,
  currentActive
) {

  if (!canManageUsers()) {

    alert(
      "Você não tem permissão para alterar usuários."
    );

    return;
  }

  if (
    userId ===
    state.user?.id
  ) {

    alert(
      "Você não pode desativar o usuário que está conectado."
    );

    return;
  }

  const newStatus =
    !currentActive;

  const confirmed =
    confirm(
      newStatus
        ? "Deseja ativar este usuário?"
        : "Deseja desativar este usuário?"
    );

  if (!confirmed) {
    return;
  }

  try {

    const { data, error } = await sb.functions.invoke("admin-users", {
      body: { action: "toggle", user_id: userId, active: newStatus }
    });
    if (error) throw error;
    if (!data?.success) throw new Error(data?.error || "Não foi possível alterar o status do usuário.");

    await loadProfiles();

    render();

  } catch (error) {

    showError(error);

  }
}


/* =========================================================
   ALTERAR FUNÇÃO
   ========================================================= */

async function changeUserRole(
  userId,
  currentRole
) {

  if (!canManageUsers()) {
    return;
  }

  if (
    userId ===
    state.user?.id
  ) {

    alert(
      "A função do usuário conectado não pode ser alterada."
    );

    return;
  }

  const newRole =
    prompt(
      "Digite a nova função:\n\n" +
      "admin\n" +
      "coordinator\n" +
      "researcher\n" +
      "candidate",
      currentRole
    );

  if (!newRole) {
    return;
  }

  const normalized =
    newRole
      .trim()
      .toLowerCase();

  if (
    ![
      "admin",
      "coordinator",
      "researcher",
      "candidate"
    ].includes(
      normalized
    )
  ) {

    alert(
      "Função inválida."
    );

    return;
  }

  if (
    state.profile?.role ===
      "coordinator" &&
    normalized ===
      "admin"
  ) {

    alert(
      "O Coordenador não pode criar ou promover um Administrador."
    );

    return;
  }

  try {

    const { data, error } = await sb.functions.invoke("admin-users", {
      body: { action: "update", user_id: userId, role: normalized }
    });
    if (error) throw error;
    if (!data?.success) throw new Error(data?.error || "Não foi possível alterar a função.");

    await loadProfiles();

    render();

  } catch (error) {

    showError(error);

  }
}



/* =========================================================

   ========================================================= */
async function editUser(userId) {
  if (!canManageUsers()) return alert("Você não tem permissão para editar usuários.");
  const user = usersCache?.find(u => u.id === userId);
  if (!user) return alert("Usuário não encontrado.");
  const fullName = prompt("Nome completo:", user.full_name || "");
  if (fullName === null) return;
  const username = prompt("Usuário de acesso:", user.username || "");
  if (username === null) return;
  const newCode = prompt("Novo código de acesso (deixe vazio para manter o atual):", "");
  if (newCode === null) return;
  const payload = { action: "update", user_id: userId, full_name: fullName.trim(), username: username.trim().toLowerCase() };
  if (newCode.trim()) { if (newCode.trim().length < 6) return alert("O código precisa ter pelo menos 6 caracteres."); payload.password = newCode.trim(); payload.access_code = newCode.trim(); }
  try {
    const { data, error } = await sb.functions.invoke("admin-users", { body: payload });
    if (error) throw error;
    if (!data?.success) throw new Error(data?.error || "Não foi possível atualizar o usuário.");
    await loadProfiles(); render(); alert("Usuário atualizado com sucesso!");
  } catch (error) { showError(error); }
}

/* =========================================================

   ========================================================= */

async function deleteUserFromPanel(
  userId
) {

  if (!canManageUsers()) {
    return;
  }

  if (
    userId ===
    state.user?.id
  ) {

    alert(
      "Você não pode excluir o usuário conectado."
    );

    return;
  }

  const userName = usersCache?.find?.(u => u.id === userId)?.full_name || "Usuário";

  const confirmed =
    confirm(
      `Deseja realmente excluir o usuário "${userName}"?`
    );

  if (!confirmed) {
    return;
  }

  try {

    const {
      data,
      error
    } = await sb.functions.invoke(
      "admin-users",
      {
        body: {
          action:
            "delete",
          user_id:
            userId
        }
      }
    );

    if (error) {
      throw error;
    }

    if (data?.error) {
      throw new Error(
        data.error
      );
    }

    await loadProfiles();

    render();

    alert(
      "Usuário excluído com sucesso."
    );

  } catch (error) {

    showError(error);

  }
}

/* =========================================================
   COPIAR DADOS DE USUÁRIO JÁ CADASTRADO
   ========================================================= */

async function copyExistingUserAccess(
  userId,
  type
) {

  try {

    const user =
      usersCache.find(
        item =>
          item.id === userId
      );

    if (!user) {

      throw new Error(
        "Usuário não encontrado."
      );

    }

    const value =
      type === "username"
        ? user.username
        : user.access_code;

    if (!value) {

      throw new Error(
        "Este usuário não possui essa informação cadastrada."
      );

    }

    await navigator.clipboard.writeText(
      String(value)
    );

    alert(
      type === "username"
        ? "Usuário copiado!"
        : "Código de acesso copiado!"
    );

  } catch (error) {

    console.error(
      error
    );

    alert(
      error?.message ||
      "Não foi possível copiar."
    );

  }
}

/* =========================================================
   SALVAR PESQUISAS DO PESQUISADOR
   ========================================================= */

async function saveResearcherSurveys(
  researcherId
) {

  if (!canManageUsers()) {

    alert(
      "Você não tem permissão."
    );

    return;
  }

  const button =
    document.querySelector(
      "#saveResearcherSurveysButton"
    );

  try {

    if (button) {

      button.disabled =
        true;

      button.textContent =
        "SALVANDO...";
    }


    /*
     * Captura somente as pesquisas
     * marcadas pelo administrador.
     */
    const selected =
      Array.from(
        document.querySelectorAll(
          ".researcher-survey-check:checked"
        )
      ).map(
        checkbox =>
          checkbox.value
      );


    /*
     * Busca as permissões existentes.
     */
    const {
      data: existing,
      error: existingError
    } = await sb
      .from("survey_access")
      .select(
        "id, survey_id"
      )
      .eq(
        "user_id",
        researcherId
      );

    if (existingError) {
      throw existingError;
    }


    const existingMap =
      new Map(
        (existing || [])
          .map(
            item => [
              item.survey_id,
              item.id
            ]
          )
      );


    /*
     * Desativa permissões antigas.
     *
     * Não apagamos o histórico.
     */
    const {
      error: disableError
    } = await sb
      .from("survey_access")
      .update({
        can_view:
          false
      })
      .eq(
        "user_id",
        researcherId
      );

    if (disableError) {
      throw disableError;
    }


    /*
     * Reativa ou cria as selecionadas.
     */
    for (
      const surveyId of selected
    ) {

      const existingId =
        existingMap.get(
          surveyId
        );


      if (existingId) {

        const {
          error
        } = await sb
          .from("survey_access")
          .update({
            can_view: true
          })
          .eq(
            "id",
            existingId
          );

        if (error) {
          throw error;
        }

      } else {

        const {
          error
        } = await sb
          .from("survey_access")
          .insert({
            user_id:
              researcherId,

            survey_id:
              surveyId,

            can_view:
              true,
            can_create_interview:
              true,
            can_export:
              false,
            can_manage_users:
              false
          });

        if (error) {
          throw error;
        }
      }
    }


    closeResearcherSurveys();

    alert(
      "Pesquisas do pesquisador atualizadas com sucesso."
    );


    /*
     * Se estamos editando o usuário conectado,
     * recarrega imediatamente suas permissões.
     */
    if (
      researcherId ===
      state.user?.id
    ) {

      await loadSurveyData();

      render();

    }

  } catch (error) {

    console.error(
      "ERRO AO SALVAR ATRIBUIÇÕES:",
      error
    );

    showError(error);

    if (button) {

      button.disabled =
        false;

      button.textContent =
        "💾 SALVAR ATRIBUIÇÕES";

    }
  }
}

   ========================================================= */

async function createSurvey() {

  if (!canManageUsers()) {

    alert(
      "Você não tem permissão para criar pesquisas."
    );

    return;
  }


  const candidate =
    document
      .querySelector(
        "#surveyCandidate"
      )
      ?.value
      .trim();


  const office =
    document
      .querySelector(
        "#surveyOffice"
      )
      ?.value
      .trim();


  const description =
    document
      .querySelector(
        "#surveyDescription"
      )
      ?.value
      .trim();


  if (!candidate) {

    alert(
      "Digite o nome do candidato."
    );

    return;
  }


  if (!office) {

    alert(
      "Digite o cargo."
    );

    return;
  }


  const button =
    document.querySelector(
      "#saveSurveyButton"
    );


  if (button) {

    button.disabled =
      true;

    button.textContent =
      "CRIANDO...";
  }


  try {

    /*
     * IMPORTANTE:
     * name é obrigatório na tabela surveys.
     *
     * candidate_name também é preenchido
     * para manter compatibilidade com a interface.
     */
    const {
      data,
      error
    } = await sb
      .from("surveys")
      .insert({

        name:
          candidate,

        candidate_name:
          candidate,

        office:
          office,

        description:
          description ||
          null,

        status:
          "active"

      })
      .select()
      .single();


    if (error) {
      throw error;
    }


    closeSurveyForm();


    await loadSurveyData();


    /*
     * Seleciona automaticamente
     * a pesquisa recém-criada.
     */
    if (data) {

      state.survey =
        data;

      await loadSurveyData();

    }


    render();


    alert(
      "Pesquisa criada com sucesso!"
    );


  } catch (error) {

    console.error(
      "ERRO AO CRIAR PESQUISA:",
      error
    );


    showError(error);


    if (button) {

      button.disabled =
        false;

      button.textContent =
        "CRIAR PESQUISA";

    }
  }
}


/* =========================================================
   ALTERAR STATUS DA PESQUISA
   ========================================================= */

async function toggleSurveyStatus(
  surveyId,
  currentStatus
) {

  if (!canManageUsers()) {

    alert(
      "Você não tem permissão para alterar pesquisas."
    );

    return;
  }


  const newStatus =
    currentStatus === "active"
      ? "paused"
      : "active";


  const question =
    currentStatus === "active"

      ? "Deseja pausar esta pesquisa?"

      : "Deseja ativar esta pesquisa novamente?";


  if (!confirm(question)) {
    return;
  }


  try {

    const {
      error
    } = await sb
      .from("surveys")
      .update({
        status:
          newStatus
      })
      .eq(
        "id",
        surveyId
      );


    if (error) {
      throw error;
    }


    /*
     * Se a pesquisa atual foi pausada,
     * o pesquisador não poderá mais
     * utilizá-la.
     */
    if (
      state.survey?.id ===
      surveyId
    ) {

      state.survey =
        null;

    }


    await loadSurveyData();

    render();


  } catch (error) {

    showError(error);

  }
}


/* =========================================================
   EXCLUIR PESQUISA
   ========================================================= */

async function deleteSurvey(
  surveyId
) {

  if (!canManageUsers()) {

    alert(
      "Você não tem permissão para excluir pesquisas."
    );

    return;
  }


  const surveyName = state.surveys?.find?.(s => s.id === surveyId)?.candidate_name ||
    state.surveys?.find?.(s => s.id === surveyId)?.name || "Pesquisa";

  const confirmed =
    confirm(
      `ATENÇÃO!

Deseja excluir definitivamente a pesquisa:

"${surveyName}"?

Essa ação poderá remover também
os dados relacionados a ela.`
    );


  if (!confirmed) {
    return;
  }


  try {

    const { data: deleted, error } = await sb
      .from("surveys")
      .delete()
      .eq("id", surveyId)
      .select("id")
      .maybeSingle();


    if (error) {
      throw error;
    }

    if (!deleted) throw new Error("A pesquisa não foi excluída. Verifique as permissões.");


    if (
      state.survey?.id ===
      surveyId
    ) {

      state.survey =
        null;

    }


    await loadSurveyData();

    render();


    alert(
      "Pesquisa excluída com sucesso!"
    );


  } catch (error) {

    console.error(
      "ERRO AO EXCLUIR PESQUISA:",
      error
    );

    showError(error);

  }
}

async function editSurvey(surveyId) {
  if (!canManageUsers()) return alert("Você não tem permissão para editar pesquisas.");

  if (!survey) return alert("Pesquisa não encontrada.");
  const candidate = prompt("Nome da pesquisa/candidato:", survey.candidate_name || survey.name || "");

  const office = prompt("Cargo:", survey.office || "");
  if (office === null) return;
  const description = prompt("Descrição:", survey.description || "");
  if (description === null) return;
  try {
    const { data, error } = await sb.from("surveys").update({
      name: candidate.trim(), candidate_name: candidate.trim(), office: office.trim(), description: description.trim() || null
    }).eq("id", surveyId).select("id").maybeSingle();
    if (error) throw error;
    if (!data) throw new Error("A pesquisa não foi atualizada. Verifique suas permissões no Supabase.");
    await loadSurveyData(); render(); alert("Pesquisa atualizada com sucesso!");
  } catch (error) { showError(error); }
}

function closeUserPermissions(){ document.querySelector("#userPermissionsModal")?.remove(); }
async function saveUserPermissions(userId) {
  if (!canManageUsers()) return;
  const button=document.querySelector("#saveUserPermissionsButton"); if(button){button.disabled=true;button.textContent="SALVANDO...";}
  try {
    const ids = Array.from(document.querySelectorAll(".perm-view")).map(x=>x.dataset.survey);
    const existingResult = await sb.from("survey_access").select("id,survey_id").eq("user_id",userId);
    if(existingResult.error) throw existingResult.error;
    const existing=new Map((existingResult.data||[]).map(x=>[x.survey_id,x.id]));
    for(const surveyId of ids){
      const view=document.querySelector(`.perm-view[data-survey="${surveyId}"]`).checked;
      const interview=document.querySelector(`.perm-interview[data-survey="${surveyId}"]`).checked;
      const exp=document.querySelector(`.perm-export[data-survey="${surveyId}"]`).checked;
      const manage=document.querySelector(`.perm-manage[data-survey="${surveyId}"]`).checked;
      const payload={can_view:view,can_create_interview:interview,can_export:exp,can_manage_users:manage};
      if(existing.has(surveyId)) { const r=await sb.from("survey_access").update(payload).eq("id",existing.get(surveyId)).select("id").maybeSingle(); if(r.error) throw r.error; }
      else if(view||interview||exp||manage) { const r=await sb.from("survey_access").insert({user_id:userId,survey_id:surveyId,...payload}).select("id").maybeSingle(); if(r.error) throw r.error; }
    }
    closeUserPermissions(); await loadProfiles(); await loadSurveyData(); render(); alert("Acessos atualizados com sucesso!");
  } catch(error){ showError(error); if(button){button.disabled=false;button.textContent="💾 SALVAR ACESSOS";} }
}

}

/* =========================================================
   CRIAR CONGREGAÇÃO
   ========================================================= */

async function createCongregation() {

  if (!state.survey) {

    alert(
      "Selecione uma pesquisa primeiro."
    );

    return;
  }


  const regionId =
    document
      .querySelector(
        "#congregationRegion"
      )
      ?.value;


  const name =
    document
      .querySelector(
        "#congregationName"
      )
      ?.value
      .trim();


  if (!regionId) {

    alert(
      "Selecione a região."
    );

    return;
  }


  if (!name) {

    alert(
      "Digite o nome da congregação."
    );

    return;
  }


  try {

    const { data: duplicate } = await sb.from("congregations").select("id").eq("survey_id", state.survey.id).ilike("name", name).maybeSingle();
    if (duplicate) throw new Error("Já existe uma congregação com esse nome nesta pesquisa.");

    const {
      error
    } = await sb
      .from("congregations")
      .insert({

        survey_id:
          state.survey.id,

        region_id:
          regionId,

        name:
          name

      });


    if (error) {
      throw error;
    }


    closeCongregationForm();


    await loadSurveyData();


    render();


    alert(
      "Congregação cadastrada com sucesso!"
    );


  } catch (error) {

    showError(error);

  }
}


/* =========================================================
   EXCLUIR CONGREGAÇÃO
   ========================================================= */

async function deleteCongregation(
  id
) {

  if (!canManageUsers()) {
    alert("Você não tem permissão para excluir este registro.");
    return;
  }

  const name = state.congregations?.find?.(c => c.id === id)?.name || "Congregação";

  if (
    !confirm(
      `Excluir a congregação "${name}"?`
    )
  ) {
    return;
  }


  try {

    const { data: deleted, error } = await sb
      .from("congregations")
      .delete()
      .eq("id", id)
      .select("id")
      .maybeSingle();


    if (error) {
      throw error;
    }

    if (!deleted) throw new Error("A congregação não foi excluída. Verifique as permissões.");


    await loadSurveyData();

    render();


  } catch (error) {

    showError(error);

  }
}

   ========================================================= */

async function submitInterview() {

  if (!state.user) {

    alert(
      "Sua sessão expirou. Entre novamente."
    );

    return;
  }


  if (!state.survey) {

    alert(
      "Nenhuma pesquisa selecionada."
    );

    return;
  }


  /*
   * Captura a observação antes de enviar.
   */
  const reasonInput =
    document.querySelector(
      "#interviewReason"
    );

  if (reasonInput) {

    state.form.reason =
      reasonInput.value.trim();

  }


  if (
    !state.form.interviewee_name ||
    !state.form.region_id ||
    !state.form.congregation_id ||
    !state.form.intention
  ) {

    alert(
      "Preencha todos os dados da entrevista."
    );

    return;
  }


  const button =
    document.querySelector(
      "button[onclick*='submitInterview']"
    );


  if (button) {

    button.disabled =
      true;

    button.textContent =
      "ENVIANDO...";
  }


  try {

    /*
     * Confirma novamente que o pesquisador
     * possui acesso à pesquisa.
     */
    if (
      state.profile?.role ===
      "researcher"
    ) {

      const {
        data: access,
        error: accessError
      } = await sb
        .from("survey_access")
        .select("id")
        .eq(
          "user_id",
          state.user.id
        )
        .eq(
          "survey_id",
          state.survey.id
        )
        .eq(
          "can_view",
          true
        )
        .eq(
          "can_create_interview",
          true
        )
        .maybeSingle();


      if (accessError) {
        throw accessError;
      }


      if (!access) {

        throw new Error(
          "Você não possui autorização para realizar esta pesquisa."
        );

      }
    }


    const {
      error
    } = await sb
      .from("interviews")
      .insert({

        survey_id:
          state.survey.id,

        researcher_id:
          state.user.id,

        interviewee_name:
          state.form.interviewee_name,

        region_id:
          state.form.region_id,

        congregation_id:
          state.form.congregation_id,

        intention:
          state.form.intention,

        reason:
          state.form.reason ||
          null

      });


    if (error) {
      throw error;
    }


    alert(
      "Entrevista registrada com sucesso!"
    );


    /*
     * Limpa somente depois de gravar
     * com sucesso.
     */
    resetForm();

    state.interviewStep =
      1;


    await loadSurveyData();


    render();


  } catch (error) {

    console.error(
      "ERRO AO ENVIAR ENTREVISTA:",
      error
    );

    showError(error);


    if (button) {

      button.disabled =
        false;

      button.textContent =
        "✅ CONFIRMAR ENTREVISTA";

    }
  }
}

      loginView();

  if (
    canManageUsers() &&
    state.page ===
      "users"

      console.error(
        error

  let content =
    "";

function openPlatformAccess() {
  const old=document.querySelector("#platformAccessModal"); if(old) old.remove();
  const url=window.location.href;
  const modal=document.createElement("div"); modal.id="platformAccessModal";
  Object.assign(modal.style,{position:"fixed",inset:"0",zIndex:"10002",background:"rgba(0,0,0,.65)",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"});
  modal.innerHTML=`<div class="card" style="width:100%;max-width:620px"><div class="row"><div><h2>📱 Acesso multiplataforma</h2><p class="muted">A mesma Central pode ser aberta em celular, tablet, notebook ou computador.</p></div><button class="btn small" onclick="closePlatformAccess()">✕</button></div>
  <div class="card" style="margin-top:15px"><strong>Endereço da Central</strong><div style="display:flex;gap:8px;margin-top:10px"><input id="platformUrl" value="${esc(url)}" readonly style="flex:1"><button class="btn" onclick="copyPlatformUrl()">📋 Copiar</button></div></div>
  <div class="actions" style="margin-top:15px;flex-wrap:wrap"><button class="btn primary" onclick="openPlatformUrl()">🌐 Abrir Central</button><button class="btn" onclick="sharePlatformWhatsApp()">📲 Enviar pelo WhatsApp</button></div></div>`;
  document.body.appendChild(modal);
}
function closePlatformAccess(){document.querySelector("#platformAccessModal")?.remove();}
async function copyPlatformUrl(){try{await navigator.clipboard.writeText(window.location.href);alert("Endereço copiado!");}catch(e){showError(e);}}
function openPlatformUrl(){window.open(window.location.href,"_blank","noopener,noreferrer");}
function sharePlatformWhatsApp(){const text=`Acesse a Central de Pesquisas: ${window.location.href}`;window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank","noopener,noreferrer");}

          <label style="display:block;font-weight:700;font-size:13px;margin-bottom:6px">🏢 Nome da empresa (aparece no cabeçalho)</label>

        onclick="resetCentralSettings()"
      >
        ↺ Restaurar configurações
      </button>

    </div>
  `;

  document.body.appendChild(modal);
}


function setCentralTheme(theme) {

  document.body.dataset.theme = theme;

  localStorage.setItem(
    "central_theme",
    theme
  );

  openCentralSettings();
}


function setCentralLayout(layout) {

  document.body.dataset.layout = layout;

  localStorage.setItem(
    "central_layout",
    layout
  );

  openCentralSettings();
}


function resetCentralSettings() {

  localStorage.removeItem(
    "central_theme"
  );

  localStorage.removeItem(
    "central_layout"
  );

  document.body.dataset.theme = "claro";
  document.body.dataset.layout = "normal";

  openCentralSettings();
}


function loadCentralSettings() {

  const theme =
    localStorage.getItem(
      "central_theme"
    ) || "claro";

  const layout =
    localStorage.getItem(
      "central_layout"
    ) || "normal";

  document.body.dataset.theme =
    theme;

  document.body.dataset.layout =
    layout;
}
