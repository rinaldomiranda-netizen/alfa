name: RMD Atendimento Church

on:
  push:
    paths:
      - "modules/atendimento_church/**"
      - "skills/rmd-atendimento-church/**"
      - ".github/workflows/rmd-atendimento-church.yml"
  pull_request:
    paths:
      - "modules/atendimento_church/**"
      - "skills/rmd-atendimento-church/**"
      - ".github/workflows/rmd-atendimento-church.yml"

jobs:
  atendimento-church:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run RMD Atendimento Church tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest modules.atendimento_church.test_church -v

      - name: Verify module imports
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "from modules.atendimento_church import AtendimentoChurchModule, AtendimentoChurchService; print('RMD Atendimento Church imports OK')"
