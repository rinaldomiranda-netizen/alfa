<!doctype html>
<html lang="pt-BR" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMD Atendimento Church</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
:root,[data-theme="claro"]{--bg:#F2F5F9;--s1:#FFFFFF;--s2:#EDF1F7;--tx:#152238;--mu:#5B6A82;--ln:#DCE3EE;--ac:#0B7A6E;--ai:#FFFFFF;--acx:#0B7A6E;--ok:#16813F;--wa:#9A5B00;--er:#C23B3B;--in:#2C5BD0;--sb:#0F1B2D;--sh:0 4px 18px rgba(20,40,80,.07)}
[data-theme="escuro"]{--bg:#0B1220;--s1:#121B2E;--s2:#1A2540;--tx:#E8EEF9;--mu:#91A1BF;--ln:#24324F;--ac:#2DD4BF;--ai:#04231F;--acx:#2DD4BF;--ok:#4ADE80;--wa:#F5B94A;--er:#F26D6D;--in:#7FA3FF;--sb:#070C17;--sh:0 8px 28px rgba(0,0,0,.35)}
[data-theme="medio"]{--bg:#27334C;--s1:#303F5C;--s2:#3A4B6D;--tx:#F1F5FC;--mu:#B9C6DD;--ln:#4B5D84;--ac:#5EEAD4;--ai:#06302B;--acx:#5EEAD4;--ok:#6EE7A0;--wa:#F8C766;--er:#FF8F8F;--in:#9DB8FF;--sb:#1B2539;--sh:0 8px 24px rgba(10,16,30,.3)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Sora',sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{background:var(--sb);color:#C7D2E5;padding:20px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow-y:auto}
.brandline{display:flex;align-items:center;gap:12px;padding:0 8px}
.logo{width:38px;height:38px;border-radius:11px;background:#2DD4BF;color:#04231F;display:grid;place-items:center;flex:0 0 38px}
.brandline b{font-family:'Sora',sans-serif;font-size:15px;color:#fff;display:block;line-height:1.2}
.brandline span{font-size:12px;color:#8FA0BF}
.grp{font-size:12px;color:#7F90AD;padding:12px 12px 4px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:9px 12px;color:#C7D2E5;font-weight:500;min-height:44px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button[aria-current="page"]{background:rgba(45,212,191,.16);color:#fff;box-shadow:inset 3px 0 0 #2DD4BF}
.nav .bdg{margin-left:auto;background:#F5B94A;color:#1A1200;border-radius:99px;font-size:11px;font-weight:600;padding:1px 8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--s1);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:12px 28px}
.co{display:flex;flex-direction:column;min-width:0}
.co b{font-family:'Sora',sans-serif;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co span{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--s1);border:1px solid var(--ln);display:grid;place-items:center;position:relative;flex:0 0 44px}
.iconbtn:hover{border-color:var(--ac)}
.iconbtn .cnt{position:absolute;top:-5px;right:-5px;background:var(--er);color:#fff;font-size:11px;font-weight:600;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.menubtn{display:none}
.unit{background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;min-height:44px;max-width:230px}
.sync{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:99px;padding:7px 14px;font-size:12.5px;color:var(--mu);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--s2);border:1px solid var(--ln);display:grid;place-items:center;font-weight:600;font-size:13px;flex:0 0 38px}
.content{padding:26px 28px 34px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead h1{font-size:25px}
.pagehead p{margin:4px 0 0;color:var(--mu)}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:20px;box-shadow:var(--sh)}
.card h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{display:flex;flex-direction:column;gap:4px;padding:18px}
.stat .lb{color:var(--mu);font-size:13px;display:flex;align-items:center;gap:8px}
.stat .v{font-family:'Sora',sans-serif;font-size:29px;font-weight:600;line-height:1.15}
.stat .d{font-size:12.5px;color:var(--mu)}
.btn{border:1px solid var(--ln);background:var(--s1);border-radius:10px;padding:9px 16px;font-weight:500;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);color:var(--ai);border-color:var(--ac);font-weight:600}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--s2);border:1px solid var(--ln);border-radius:99px;padding:7px 14px;font-size:13.5px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ac);color:var(--ai);border-color:var(--ac);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--mu);font-weight:500}
.inp{background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;min-height:44px;width:100%}
.inp:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 3px rgba(45,212,191,.22)}
textarea.inp{min-height:90px;resize:vertical}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border-bottom:0}
.row.wrap{flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500}
.row .s{font-size:13px;color:var(--mu)}
.acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap}
.p-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.p-wa{background:color-mix(in srgb,var(--wa) 16%,transparent);color:var(--wa)}
.p-er{background:color-mix(in srgb,var(--er) 15%,transparent);color:var(--er)}
.p-in{background:color-mix(in srgb,var(--in) 15%,transparent);color:var(--in)}
.p-mu{background:var(--s2);color:var(--mu)}
.trkbtn{background:none;border:0;min-height:44px;min-width:56px;padding:0;display:grid;place-items:center}
.trk{display:block;width:44px;height:26px;border-radius:99px;background:var(--s2);border:1px solid var(--ln);position:relative;transition:.2s}
.trk::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:.2s}
[aria-checked="true"] .trk{background:var(--ac);border-color:var(--ac)}
[aria-checked="true"] .trk::after{left:20px;background:var(--ai)}
.bar{height:8px;border-radius:99px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.chart text{fill:var(--mu);font-size:11px;font-family:'DM Sans',sans-serif}
.empty{color:var(--mu);text-align:center;padding:26px 0}
.sdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px}
.on{background:var(--ok)}.aw{background:var(--wa)}.off{background:var(--mu)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.flow span.st{background:var(--s2);border:1px solid var(--ln);border-radius:8px;padding:5px 10px;font-size:13px}
.flow svg{color:var(--mu);flex:0 0 16px}
/* central de atendimento */
.atd{display:grid;grid-template-columns:320px minmax(0,1fr) 290px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh);height:calc(100vh - 210px);height:calc(100dvh - 210px);min-height:540px;overflow:hidden}
.lst{border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.lst .lh{padding:14px;border-bottom:1px solid var(--ln);display:flex;flex-direction:column;gap:10px}
.lst .items{overflow-y:auto;flex:1}
.ci{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:13px 14px;min-height:64px;align-items:flex-start;color:inherit}
.ci:hover{background:var(--s2)}
.ci[aria-current="true"]{background:var(--s2);box-shadow:inset 3px 0 0 var(--ac)}
.ci .sn{flex:1;min-width:0}
.ci .sn b{display:block;font-weight:600;font-size:14.5px}
.ci .sn span{display:block;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cht{display:flex;flex-direction:column;min-height:0;min-width:0}
.chh{padding:12px 16px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.mb{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14.5px}
.mb small{display:block;font-size:11.5px;opacity:.7;margin-top:2px}
.mb.p{align-self:flex-start;background:var(--s1);border:1px solid var(--ln);border-bottom-left-radius:4px}
.mb.a{align-self:flex-end;background:var(--ac);color:var(--ai);border-bottom-right-radius:4px}
.qr{display:flex;gap:8px;padding:10px 16px 0;overflow-x:auto;flex-wrap:wrap}
.cmp{display:flex;gap:10px;padding:12px 16px 16px}
.cmp .inp{flex:1}
.fic{border-left:1px solid var(--ln);padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.back{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
.rad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rad label{cursor:pointer;display:block}
.rad input{position:absolute;opacity:0;pointer-events:none}
.rad .opt{border:2px solid var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--s2)}
.rad input:checked+.opt{border-color:var(--ac)}
.rad input:focus-visible+.opt{outline:2px solid var(--ac);outline-offset:2px}
.swt{height:54px;border-radius:9px;display:flex;flex-direction:column;gap:5px;padding:8px}
.swt i{display:block;height:8px;border-radius:4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--mu);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--ln)}
.tbl td{padding:10px;border-bottom:1px solid var(--ln)}
.tbl td.c,.tbl th.c{text-align:center}
.scroll{overflow-x:auto}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.atd{grid-template-columns:300px minmax(0,1fr)}.fic{display:none}}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(86vw,300px);transform:translateX(-102%);transition:transform .25s;z-index:40;padding-top:calc(20px + env(safe-area-inset-top,0px))}
 .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
 .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
 .menubtn{display:grid}
 .top{padding:10px 14px}
 .sync .lbl,.unit{display:none}
 .content{padding:16px 14px 30px}
 .g3,.g2e{grid-template-columns:minmax(0,1fr)}
 .atd{grid-template-columns:minmax(0,1fr);height:calc(100dvh - 190px);min-height:480px}
 .atd.open .lst{display:none}
 .atd:not(.open) .cht{display:none}
 .back{display:grid}
}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.stat .v{font-size:25px}.rad{grid-template-columns:minmax(0,1fr)}.mb{max-width:88%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

var POLL_MS=4000,cfgT=null,seeded=false,pollTimer=null,streamConn=null,tokenPrompted=false;
function apiHeaders(){var h={'Content-Type':'application/json'};var tk=store('atd.token');if(tk)h['X-Church-Token']=tk;return h}
function pedirToken(){if(tokenPrompted)return;tokenPrompted=true;var tk=window.prompt('Este painel pede uma chave de acesso. Cole aqui:');tokenPrompted=false;if(tk){store('atd.token',tk);location.reload()}}
function jsonFetch(url,opts){opts=opts||{};opts.headers=Object.assign(apiHeaders(),opts.headers||{});return fetch(url,opts).then(function(r){if(r.status===401){pedirToken();throw new Error('sem acesso')}if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function cvData(c){return {id:c.id,n:c.n,c:c.c,f:c.f,a:c.a,st:c.st,w:c.w,ag:c.ag||'',m:c.m,t:c.t||0}}
function saveConv(c){if(!c.t)c.t=Date.now();jsonFetch(apiUrl('api/conversa'),{method:'POST',body:JSON.stringify(cvData(c))}).catch(function(){toast('Não foi possível salvar agora. Tente de novo.')})}
function cfgData(){return {sol:sol,agenda:agenda,fl:fluxos.map(function(o){return o.on}),sv:serv.map(function(o){return o.on}),al:alertas.map(function(a){return {on:a.on,u:a.u}}),sg:seg.map(function(o){return o.on}),pm:pm,co:S.co,hor:S.hor,boas:S.boas}}
function saveCfg(){clearTimeout(cfgT);cfgT=setTimeout(function(){jsonFetch(apiUrl('api/cfg'),{method:'POST',body:JSON.stringify(cfgData())}).catch(function(){toast('Não foi possível salvar agora. Tente de novo.')})},450)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function fmtData(iso){try{return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return iso}}
function applyCfg(d){if(!d)return;if(d.sol)sol=clone(d.sol);if(d.agenda)agenda=clone(d.agenda);if(d.pm)pm=clone(d.pm);
 (d.fl||[]).forEach(function(v,i){if(fluxos[i])fluxos[i].on=v});(d.sv||[]).forEach(function(v,i){if(serv[i])serv[i].on=v});(d.sg||[]).forEach(function(v,i){if(seg[i])seg[i].on=v});
 (d.al||[]).forEach(function(a,i){if(alertas[i]){alertas[i].on=a.on;alertas[i].u=a.u}});
 var ae=document.activeElement,fid=ae&&ae.id;
 if(d.co&&fid!=='coIn'){S.co=d.co;store('atd.co',S.co)}if(d.hor&&fid!=='hor')S.hor=d.hor;if(d.boas&&fid!=='boas')S.boas=d.boas;
 if(d.ultimo_backup)S.bk=fmtData(d.ultimo_backup)}
function setSync(ok){document.getElementById('slbl').textContent=ok?'Salvo online':'Modo demonstração';var d=document.getElementById('sdot');d.style.background=ok?'':'var(--wa)';d.style.animation=ok?'':'none'}
function aplicarEstado(d){
 setSync(!!d.online);
 if(Array.isArray(d.conversas)&&d.conversas.length){conv=d.conversas.map(clone).sort(function(a,b){return (b.t||0)-(a.t||0)});if(!byId(S.cid))S.cid=null}
 else if(d.online&&!seeded){seeded=true;conv.forEach(saveConv)}
 applyCfg(d.cfg);renderCo();render()
}
function pollStateOnce(){return jsonFetch(apiUrl('api/state')).then(aplicarEstado).catch(function(){setSync(false)})}
function initPolling(){if(pollTimer)return;pollStateOnce();pollTimer=setInterval(pollStateOnce,POLL_MS)}
function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
function initStream(){
 if(!('EventSource' in window)){return initPolling()}
 try{
  streamConn=new EventSource(apiUrl('api/stream'));
  streamConn.onmessage=function(ev){try{aplicarEstado(JSON.parse(ev.data))}catch(e){}};
  streamConn.onerror=function(){if(streamConn){streamConn.close();streamConn=null}setSync(false);if(!pollTimer)initPolling()};
  streamConn.onopen=function(){stopPolling()};
 }catch(e){initPolling()}
}
function initDb(){initStream();setTimeout(function(){if(!streamConn)initPolling()},2500)}

   S.bk='Agora ('+hm()+')';toast('Backup baixado com sucesso')
  }).catch(function(){toast('Não foi possível gerar o backup agora (verifique se está conectado à nuvem).')}).finally(function(){S.bkpEmAndamento=false;if(S.v==='bkp')render()})}
});
document.addEventListener('submit',function(e){e.preventDefault();
 if(e.target.id==='fm'){var i=document.getElementById('mi');send(i.value)}
 if(e.target.id==='fag'){var g=function(id){return document.getElementById(id).value};agenda.push({d:g('ad'),h:g('ah').replace(':00','h').replace(':','h'),n:g('an'),t:g('at'),p:g('ap')});toast('Agendado com '+g('ap'));saveCfg();render()}});
document.addEventListener('change',function(e){
 if(e.target.name==='th'){S.theme=e.target.value;store('atd.theme',S.theme);applyTheme();toast('Tema aplicado')}
 if(e.target.id==='trf'){var c=byId(S.cid);c.f=e.target.value;toast('Transferido para a fila '+c.f);saveConv(c);render()}});
document.addEventListener('input',function(e){
 if(e.target.id==='coIn'){S.co=e.target.value.trim()||'Nome da igreja';store('atd.co',S.co);saveCfg();renderCo()}
 if(e.target.id==='hor'){S.hor=e.target.value;saveCfg()}if(e.target.id==='boas'){S.boas=e.target.value;saveCfg()}});
initDb();
applyTheme();renderCo();render();
})();
</script>
